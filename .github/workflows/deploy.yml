name: Deploy to GitHub Pages

# The app is static — no build, no bundler — so this job is really just
# "copy the repo onto the gh-pages branch", minus what is not part of the site.
#
# It publishes by pushing a branch rather than through the Pages deployment API,
# because that route needs Pages set to "GitHub Actions" as its source, and a
# repository whose Actions token is read-only cannot set that itself. Pages is
# serving from the gh-pages branch, and pushing to it is an ordinary write.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One publish at a time; a newer push supersedes one still in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Stage the site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude '_color.py' \
            ./ _site/
          # Pages runs Jekyll unless told not to, which would drop any file
          # or folder whose name starts with an underscore.
          touch _site/.nojekyll
          test -f _site/index.html
          ls -la _site

      - name: Publish to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          # The branch is generated output: one commit, replaced each time,
          # so its history never accumulates copies of the whole app.
          git push -f \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Where it landed
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          name="${GITHUB_REPOSITORY##*/}"
          echo "Published to https://${owner,,}.github.io/${name}/" >> "$GITHUB_STEP_SUMMARY"
